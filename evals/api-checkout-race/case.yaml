schema_version: "1.0"
name: api-checkout-race
description: "Add a checkout endpoint; the prompt never mentions concurrency. Does the stock decrement survive two buyers at once?"
tags: [backend-safety]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add POST /orders in src/routes/orders.js. Body: { productId, quantity }. It should take the items out of the product's stock and create the order."
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Write, Edit]
