# Copy to .github/workflows/copilot-setup-steps.yml in your project (default
# branch). Copilot's cloud agent runs this job before it starts work.
# Bootstrap copies skills to ~/.copilot/skills and rules to
# ~/.copilot/architectural-rules, which the agent reads.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contexture
        run: curl -fsSL https://raw.githubusercontent.com/AcKeskin/contexture/main/cloud/setup.sh | bash
